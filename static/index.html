<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公車服務可靠度查詢</title>
<style>
  :root{
    --ink:#1B2A33; --paper:#F5F7F8; --line:#D8DEE2; --body:#3D4C56;
    --muted:#6B7A85; --acc:#E4863B; --acc-dk:#A85B18; --cool:#2F7D8C;
    --cool-bg:#E8F1F2; --warn-bg:#FDF3E8; --warn:#8A4B12; --bad:#A33A2E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--body);
       font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
  h1{margin:0 0 4px;font-size:25px;color:var(--ink);letter-spacing:.5px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:13.5px}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
  .grid{display:grid;gap:14px}
  @media(min-width:760px){ .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} }
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
  select,input{width:100%;padding:9px 10px;font:inherit;font-size:14px;color:var(--body);
       background:#fff;border:1px solid var(--line);border-radius:7px}
  select:disabled{background:#F2F4F5;color:#9AA7AF}
  select:focus,input:focus{outline:2px solid #BFD8DE;outline-offset:1px;border-color:var(--cool)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}

  button{margin-top:18px;padding:11px 26px;font:inherit;font-size:15px;font-weight:700;
       color:#fff;background:var(--ink);border:0;border-radius:8px;cursor:pointer}
  button:disabled{background:#A9B4BB;cursor:not-allowed}
  button:not(:disabled):hover{background:#2B3E4A}

  .totals{display:grid;gap:12px;margin:22px 0 6px}
  @media(min-width:760px){ .totals{grid-template-columns:repeat(3,1fr)} }
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .tile.hi{border-color:var(--acc);border-width:1.5px}
  .tile .big{font-size:30px;font-weight:700;line-height:1.15;color:var(--cool)}
  .tile.hi .big{color:var(--acc-dk)}
  .tile.bad .big{color:var(--bad)}
  .tile .lab{font-size:13px;font-weight:700;color:var(--ink);margin-top:6px}
  .tile .note{font-size:11.5px;color:var(--muted);margin-top:4px}

  table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff;
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:left}
  thead th{background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:0}
  tr.missing td{background:#FBF1EF;color:var(--bad)}
  tfoot td{background:var(--cool-bg);font-weight:700;color:#17505C;border-bottom:0}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
       background:#EEF1F3;color:var(--muted)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}

  .msg{margin-top:18px;padding:13px 16px;border-radius:9px;font-size:13.5px;line-height:1.55}
  .msg.info{background:var(--cool-bg);color:#17505C}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.err {background:#FBF1EF;color:var(--bad)}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
        font-size:11.5px;color:var(--muted)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>這段路平常要開多久？</h1>
  <p class="sub">
    根據 27 天的公車即時位置資料算出來的歷史基準。選一條路線、選起站和迄站，
    看每一段的「一半的車多快」與「最慢的一成多慢」。
  </p>

  <div class="card">
    <div class="grid g4">
      <div>
        <label for="city">城市</label>
        <select id="city"></select>
      </div>
      <div>
        <label for="q">找路線</label>
        <input id="q" placeholder="輸入路線號碼或站名，例如 287">
        <div class="hint" id="qhint">例如 287、藍22、榮總</div>
      </div>
      <div>
        <label for="daytype">日型</label>
        <select id="daytype"></select>
      </div>
      <div>
        <label for="band">時段</label>
        <select id="band"></select>
      </div>
    </div>

    <div class="grid g4" style="margin-top:14px">
      <div style="grid-column:span 2">
        <label for="route">路線與方向</label>
        <select id="route"><option>載入中…</option></select>
      </div>
      <div>
        <label for="from">起站</label>
        <select id="from" disabled></select>
      </div>
      <div>
        <label for="to">迄站</label>
        <select id="to" disabled></select>
      </div>
    </div>

    <button id="go" disabled>查詢</button>
  </div>

  <div id="out"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $("out");
let STOPS = [];

const j = async (url) => {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
};
const opt = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; return o; };
const fill = (sel, items, val, lab) => {
  sel.innerHTML = "";
  items.forEach(i => sel.appendChild(opt(val(i), lab(i))));
};

// ---- 啟動：把可選值全部從後端問來，前端不寫死任何城市／時段 ----
(async () => {
  try {
    const m = await j("/api/meta");
    fill($("city"), [{value:"",label:"全部"}].concat(m.cities), c=>c.value, c=>c.label);
    fill($("daytype"), m.day_types, d=>d.value, d=>d.label);
    fill($("band"), m.bands, b=>b.value, b=>b.label);
    const b = m.baseline;
    $("foot").textContent =
      `基準資料範圍 ${b.date_from} ～ ${b.date_to}（共 ${b.n_days} 天）　·　`
      + `判定規則 ${b.rule_version}　·　基準版本 ${b.baseline_version}　·　`
      + `產生時間 ${b.computed_at} UTC　·　資料來源：交通部 TDX`;
    await loadRoutes();
  } catch (e) { show(`<div class="msg err">載入失敗：${e.message}</div>`); }
})();

// ---- 路線清單 ----
let t = null;
const loadRoutes = async () => {
  const city = $("city").value, q = $("q").value.trim();
  const d = await j(`/api/routes?limit=300&city=${encodeURIComponent(city)}&q=${encodeURIComponent(q)}`);
  const sel = $("route");
  if (!d.routes.length) {
    sel.innerHTML = ""; sel.appendChild(opt("", "找不到符合的路線"));
    $("qhint").textContent = "找不到符合的路線";
  } else {
    fill(sel, d.routes,
         r => `${r.sub_route_uid}|${r.direction}`,
         r => `${r.label}　（${r.direction === 0 ? "去程" : "返程"}・${r.n_stops} 站）`);
    $("qhint").textContent = d.total > d.routes.length
      ? `符合 ${d.total} 條，只顯示前 ${d.routes.length} 條，再打幾個字縮小範圍`
      : `符合 ${d.total} 條`;
  }
  await loadStops();
};
$("city").onchange = loadRoutes;
$("q").oninput = () => { clearTimeout(t); t = setTimeout(loadRoutes, 250); };

// ---- 站序 ----
const loadStops = async () => {
  const v = $("route").value;
  const fs = $("from"), ts = $("to");
  if (!v) { fs.disabled = ts.disabled = $("go").disabled = true; fs.innerHTML = ts.innerHTML = ""; return; }
  const [uid, dir] = v.split("|");
  const d = await j(`/api/routes/${encodeURIComponent(uid)}/${dir}/stops`);
  STOPS = d.stops;
  fill(fs, STOPS.slice(0, -1), s => s.seq, s => `${s.seq}. ${s.stop_name}`);
  fs.disabled = ts.disabled = $("go").disabled = false;
  syncTo();
};
$("route").onchange = loadStops;

// 迄站只列出站序比起站大的。把不可能的組合從選單裡拿掉，
// 比讓使用者選了再跳錯誤訊息好。
const syncTo = () => {
  const from = +$("from").value;
  const prev = +$("to").value;
  const rest = STOPS.filter(s => s.seq > from);
  fill($("to"), rest, s => s.seq, s => `${s.seq}. ${s.stop_name}`);
  const keep = rest.find(s => s.seq === prev);
  $("to").value = keep ? prev : (rest[Math.min(7, rest.length - 1)] || rest[0]).seq;
};
$("from").onchange = syncTo;

// ---- 查詢 ----
const show = h => { out.innerHTML = h; };
const sec = n => `${Math.round(n)} 秒`;

$("go").onclick = async () => {
  const [uid, dir] = $("route").value.split("|");
  $("go").disabled = true; $("go").textContent = "查詢中…";
  try {
    const p = new URLSearchParams({
      sub_route_uid: uid, direction: dir,
      from_seq: $("from").value, to_seq: $("to").value,
      day_type: $("daytype").value, band: $("band").value });
    render(await j("/api/travel-time?" + p));
  } catch (e) {
    show(`<div class="msg err">查詢失敗：${e.message}</div>`);
  } finally { $("go").disabled = false; $("go").textContent = "查詢"; }
};

function render(d) {
  const c = d.coverage, T = d.totals;
  if (!T) { show(`<div class="msg err">這個區間的 ${c.n_segments} 段路全都沒有基準資料。</div>`); return; }

  const rows = d.segments.map(s => s.has_data ? `
    <tr>
      <td>${s.from_seq}. ${s.from_stop_name}</td>
      <td>${s.to_seq}. ${s.to_stop_name}</td>
      <td class="num">${s.p50_sec} 秒</td>
      <td class="num">${s.p90_sec} 秒</td>
      <td class="num">${s.n.toLocaleString()}</td>
      <td><span class="tag${s.p90_reliable ? "" : " warn"}">${s.level_label}${s.p90_reliable ? "" : "・樣本偏少"}</span></td>
    </tr>` : `
    <tr class="missing">
      <td>${s.from_seq}. ${s.from_stop_name}</td>
      <td>${s.to_seq}. ${s.to_stop_name}</td>
      <td colspan="4">這一段沒有基準資料，總時間沒有算進它</td>
    </tr>`).join("");

  const warn = [];
  if (!c.complete) warn.push(
    `<div class="msg warn"><b>${c.n_segments} 段裡有 ${c.n_missing} 段沒有資料。</b>
     下面的總時間只加了有資料的 ${c.n_with_data} 段，所以一定偏低——
     缺的段被跳過不會讓數字看起來有問題，這裡特別標出來。</div>`);
  if (c.n_weak_p90) warn.push(
    `<div class="msg warn">有 ${c.n_weak_p90} 段的樣本數不到 100 筆。
     估「一半的車」30 筆就夠穩，但估「最慢的一成」要更多——那一成只有十分之一的資料在撐。</div>`);

  show(`
  <div class="totals">
    <div class="tile">
      <div class="big">${T.mean_text}</div>
      <div class="lab">一般情況</div>
      <div class="note">${c.n_with_data} 段的平均相加</div>
    </div>
    <div class="tile hi">
      <div class="big">${T.composed_p90_text}</div>
      <div class="lab">最慢的一成要這麼久</div>
      <div class="note">Σ平均 + 1.28 × √(Σ變異數)</div>
    </div>
    <div class="tile bad">
      <div class="big">${T.naive_p90_text}</div>
      <div class="lab">若把各段的「最慢一成」直接相加</div>
      <div class="note">高估 ${T.overestimate_sec} 秒（${T.overestimate_pct}%）</div>
    </div>
  </div>

  <div class="msg info">
    分位數不能相加。把每一段的「最慢一成」加起來，等於假設每一段都同時遇到最糟的情況；
    可以相加的是平均與變異數，所以要先加起來、再從和推回分位數。
    這一趟合起來的不可靠指數是 <b>${T.unreliability}</b>——通常比其中任何單一路段都低，
    段數越多整趟反而越好預測。
  </div>
  ${warn.join("")}

  <table>
    <thead><tr>
      <th>起站</th><th>迄站</th>
      <th class="num">一半的車</th><th class="num">最慢的一成</th>
      <th class="num">資料筆數</th><th>統計來自哪一層</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr>
      <td colspan="2">共 ${c.n_segments} 段　·　${d.query.day_type_label}　${d.query.band_label}</td>
      <td class="num">${sec(T.mean_sec)}</td>
      <td class="num">${sec(T.composed_p90_sec)}</td>
      <td class="num" colspan="2">${c.complete ? "全段皆有資料" : `缺 ${c.n_missing} 段`}</td>
    </tr></tfoot>
  </table>`);
}
</script>
</body>
</html>
