name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 用真的 MySQL 8.4，跟正式環境同一個大版本。
    # 換成 SQLite 之類的替身會讓測試變快，但這支服務的三個關鍵行為
    # （LEAD 視窗函數、LEFT JOIN、information_schema 契約）
    # 全都是資料庫行為——用替身測等於沒測到重點。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: bus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-not-a-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-not-a-secret
      MYSQL_DATABASE: bus

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: 建表
        # 用 pymysql 而不是 mysql CLI。
        # runner 上有沒有 mysql client 是 runner 映像檔的事，
        # 不在這個 workflow 的宣告裡——哪天換一版把它拿掉，
        # 這裡會壞在一個看起來跟本專案無關的訊息上。
        run: python apply_sql.py sql/test_fixture_schema.sql

      - name: 灌假資料
        run: python seed_test.py

      - name: 測試
        run: python -m pytest -q
